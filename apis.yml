aid: slalom
name: Slalom
description: >-
  Slalom is a global business and technology consulting firm headquartered in Seattle, Washington,
  founded in 2001 and privately held, with roughly 12,000 employees across dozens of markets in
  North America, Europe, Asia and Australia. The firm delivers strategy, artificial intelligence,
  data, cloud and engineering, customer experience, legacy modernization, digital product building,
  and privacy and security consulting, and operates the Slalom Build brand for custom software,
  data platform and product engineering work. Slalom is a delivery partner for Microsoft, AWS,
  Salesforce, Google Cloud, Adobe and NVIDIA. It sells consulting engagements rather than software,
  and publishes no public developer program, API reference or machine-readable API contract; the
  machine-readable surface it does publish is an llms.txt at its marketing root and a security.txt
  on the Slalom Build site.
